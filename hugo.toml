baseURL = "https://www.wakaru-note.com/"
languageCode = "ja"
defaultContentLanguage = "ja"
title = "ググっても分からなかった初心者へ"
theme = "PaperMod"
paginate = 10
hasCJKLanguage = true

[params]
  env = "production"
  description = "プログラミングや技術でつまずいた初心者のための解決ノート"
  author = "ググっても分からなかった初心者へ"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  defaultTheme = "light"

  [params.footer]
    text = "[プロフィール](/about/) ・ [プライバシーポリシー](/privacy/) ・ [お問い合わせ](/contact/)"

  [params.homeInfoParams]
    Title = "ググっても分からなかった初心者へ"
    Content = "検索しても解決しなかったあの問題、ここで一緒に解決します。"

  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/1mm_mowakaranai"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    lineNos = false
    style = "monokai"

[menu]
  [[menu.main]]
    identifier = "home"
    name = "🏠 ホーム"
    url = "/"
    weight = 1
  [[menu.main]]
    identifier = "ai-blog"
    name = "🤖 AIつかいこなし帳"
    url = "https://ai.wakaru-note.com/"
    weight = 32
  [[menu.main]]
    identifier = "tags"
    name = "タグ"
    url = "/tags/"
    weight = 10
  [[menu.main]]
    identifier = "archives"
    name = "アーカイブ"
    url = "/archives/"
    weight = 20
  [[menu.main]]
    identifier = "search"
    name = "検索"
    url = "/search/"
    weight = 30
  [[menu.main]]
    identifier = "about"
    name = "プロフィール"
    url = "/about/"
    weight = 35
